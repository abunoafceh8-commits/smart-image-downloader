<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>أداة تحميل الصور مع الصور المشابهة</title><style>
body{font-family:system-ui,'Segoe UI',Tahoma;background:#0b1120;color:#e5e7eb;margin:0}header{padding:28px;text-align:center;background:#111827}
input,select,button{padding:10px 14px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#fff}
button{background:#2563eb;cursor:pointer} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;padding:20px}
.card{background:#111827;border-radius:14px;overflow:hidden} .card img{width:100%;height:160px;object-fit:cover} .card a{color:#93c5fd;font-size:13px}
</style></head><body><header><h1>أداة تحميل الصور مع الصور المشابهة</h1><p>أداة ذكية للبحث عن الصور وتحميلها مع عرض الصور المشابهة. النسخة الأصلية على CodeWords تتطلب تسجيل الدخول، فتمت إعادة بنائها كتطبيق ويب مفتوح المصدر يعمل مباشرة من المتصفح باستخدام واجهات Openverse وWikimedia Commons.</p>
<div><input id="q" placeholder="ابحث عن صور…" size="32"> <label id="xwrap" style="display:none"><input type="checkbox" id="onlyx"> Only X</label>
<button onclick="search()">بحث وتحميل</button></div><p id="st"></p></header><main class="grid" id="g"></main>
<script>
async function search(){const q=document.getElementById('q').value.trim(); if(!q) return;
 const onlyx=document.getElementById('onlyx') && document.getElementById('onlyx').checked;
 const g=document.getElementById('g'); g.innerHTML=''; document.getElementById('st').textContent='جارٍ البحث…';
 let items=[];
 try{ const r=await fetch('https://api.openverse.org/v1/images/?q='+encodeURIComponent(q)+'&page_size=40'); const j=await r.json(); items=j.results.map(x=>({url:x.url,thumb:x.thumbnail||x.url,title:x.title||q,source:'Openverse'})); }catch(e){}
 if(items.length===0){ try{ const r=await fetch('https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrnamespace=6&prop=imageinfo&iiprop=url&iiurlwidth=400&gsrlimit=40&format=json&origin=*'); const j=await r.json(); items=Object.values(j.query.pages||{}).map(p=>({url:p.imageinfo[0].url,thumb:p.imageinfo[0].thumburl,title:p.title,source:'Wikimedia'})); }catch(e){} }
 if(onlyx) items=items.filter(x=>/x\.com|twitter/i.test(x.url+x.source));
 document.getElementById('st').textContent='النتائج: '+items.length+(onlyx?' (Only X)':'');
 items.forEach(x=>{const d=document.createElement('div');d.className='card';d.innerHTML='<img loading="lazy" src="'+x.thumb+'"><div style="padding:10px"><div>'+x.title.slice(0,60)+'</div><a href="'+x.url+'" target="_blank" download>تحميل</a> · <a href="https://www.google.com/searchbyimage?image_url='+encodeURIComponent(x.url)+'" target="_blank">صور مشابهة</a></div>';g.appendChild(d);});
}
</script></body></html>
